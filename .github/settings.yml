repository:
  name: skills
  description: A secure and validated skills registry for professional AI coding agents. Extend Claude Code, Codex, Copilot, and more with complete confidence.
  homepage: https://skills.sh
  topics: agent-skills, ai-agents
  private: false
  has_issues: false
  has_projects: false
  has_wiki: false
  has_downloads: true
  default_branch: master
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  allow_auto_merge: true
  delete_branch_on_merge: true
  squash_merge_commit_title: PR_TITLE
  squash_merge_commit_message: PR_BODY
  web_commit_signoff_required: true
  enable_automated_security_fixes: true
  enable_vulnerability_alerts: true

labels:
  - name: documentation
    color: '#0075CA'
    description: Changes guides, examples, or project documentation.

branches:
  - name: master
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 0
        dismiss_stale_reviews: false
        require_code_owner_reviews: false
        dismissal_restrictions: {}
      required_status_checks: null
      enforce_admins: true
      required_linear_history: true
      allow_force_pushes: false
      allow_deletions: false
      restrictions: null
